# Nginx Configuration for JavaVerse 3D
# Place in /etc/nginx/sites-available/javaverse.conf
# or include in /etc/nginx/conf.d/

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Замените на ваш домен или IP сервера

    # Редирект на HTTPS (если настроен SSL)
    # return 301 https://$host$request_uri;

    # Вариант 1: Проксирование на Node.js сервер (рекомендуется)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вариант 2: Прямая раздача статики через Nginx (альтернатива)
    # root /var/www/javaverse-3d;
    # index index.html;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    # Кэширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
